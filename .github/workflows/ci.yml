name: Release pipeline

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: talla_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d talla_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/talla_ci
      PGSSLMODE: disable
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run migrations:validate
      - name: Apply migrations twice to prove idempotency
        run: npm run migrate && npm run migrate
      - run: npm test
      - name: Package backend release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tar --exclude=node_modules --exclude=data -czf ../talla-backend-${GITHUB_REF_NAME}.tar.gz .
          sha256sum ../talla-backend-${GITHUB_REF_NAME}.tar.gz > ../talla-backend-${GITHUB_REF_NAME}.tar.gz.sha256
      - uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: backend-${{ github.ref_name }}
          path: |
            talla-backend-${{ github.ref_name }}.tar.gz
            talla-backend-${{ github.ref_name }}.tar.gz.sha256
          retention-days: 30

  android:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x gradlew
      - name: Test, lint, and build unsigned release APK
        run: ./gradlew -Ptalla.ci=true testDebugUnitTest lintDebug assembleRelease bundleRelease --stacktrace
      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android release-hardening journeys
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          working-directory: android
          script: ./gradlew -Ptalla.ci=true connectedDebugAndroidTest --stacktrace
      - name: Checksum Android artifacts
        run: sha256sum app/build/outputs/apk/release/*.apk app/build/outputs/bundle/release/*.aab > app/build/outputs/SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: android-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/SHA256SUMS
            android/app/build/reports/lint-results-debug.html
            android/app/build/test-results/testDebugUnitTest/
          retention-days: 14

  apple:
    # Xcode 27 and iOS 27 runtimes are supplied by this Apple silicon image.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - name: Select pinned Xcode
        run: |
          XCODE_VERSION="$(tr -d '[:space:]' < .xcode-version)"
          sudo xcode-select --switch "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          xcodebuild -version
          test "$(xcrun --sdk iphoneos --show-sdk-version)" = "27.1"
      - name: Build iPhone app and embedded extensions
        run: >-
          xcodebuild -project "Talla Speciality.xcodeproj" -scheme "Talla Speciality"
          -configuration Release -destination "generic/platform=iOS Simulator"
          -derivedDataPath build/apple CODE_SIGNING_ALLOWED=NO build
      - name: Build native admin app
        run: >-
          xcodebuild -project "Talla Speciality.xcodeproj" -scheme "Talla Admin"
          -configuration Release -destination "generic/platform=iOS Simulator"
          -derivedDataPath build/admin CODE_SIGNING_ALLOWED=NO build
      - name: Run native admin model checks
        run: bash tools/check-admin-models.sh
      - name: Select an iOS 27 iPhone simulator
        run: |
          IOS_SIMULATOR_ID="$(xcrun simctl list devices available -j | jq -er '[.devices | to_entries[] | select(.key | startswith("com.apple.CoreSimulator.SimRuntime.iOS-27-")) | .value[] | select(.isAvailable and (.name | startswith("iPhone")))][0].udid // error("Install an iOS 27 runtime and create an iPhone simulator before running this job")')"
          echo "IOS_SIMULATOR_ID=${IOS_SIMULATOR_ID}" >> "$GITHUB_ENV"
      - name: Run iPhone unit tests
        run: >-
          xcodebuild -project "Talla Speciality.xcodeproj" -scheme "Talla Speciality"
          -destination "platform=iOS Simulator,id=${IOS_SIMULATOR_ID}"
          -derivedDataPath build/apple-tests
          -only-testing:"Talla SpecialityTests" test
      - name: Build Watch app
        run: >-
          xcodebuild -project "Talla Speciality.xcodeproj" -scheme "Talla Watch Watch App"
          -configuration Release -destination "generic/platform=watchOS Simulator"
          -derivedDataPath build/watch CODE_SIGNING_ALLOWED=NO build
      - name: Build iPhone widget
        run: >-
          xcodebuild -project "Talla Speciality.xcodeproj" -scheme "Talla WidgetsExtension"
          -configuration Release -destination "generic/platform=iOS Simulator"
          -derivedDataPath build/widget CODE_SIGNING_ALLOWED=NO build
      - name: Build Watch widget
        run: >-
          xcodebuild -project "Talla Speciality.xcodeproj" -scheme "Talla Watch WidgetsExtension"
          -configuration Release -destination "generic/platform=watchOS Simulator"
          -derivedDataPath build/watch-widget CODE_SIGNING_ALLOWED=NO build
      - name: Run release-hardening UI journeys
        run: |
          mkdir -p build/results
          xcodebuild -project "Talla Speciality.xcodeproj" -scheme "Talla Speciality" \
            -destination "platform=iOS Simulator,id=${IOS_SIMULATOR_ID}" \
            -derivedDataPath build/apple-ui-tests \
            -parallel-testing-enabled NO \
            -maximum-concurrent-test-simulator-destinations 1 \
            -retry-tests-on-failure -test-iterations 2 \
            -resultBundlePath build/results/Talla-UI.xcresult \
            -only-testing:"Talla SpecialityUITests/Talla_SpecialityUITests" test
      - name: Run iPhone and iPad screen-size matrix
        run: python3 tools/check-ios-device-matrix.py --layout-only --skip-build --derived-data build/apple-ui-tests
      - name: Upload device matrix diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: apple-device-results-${{ github.sha }}
          path: build/results/devices
          if-no-files-found: warn
          retention-days: 14
      - name: Upload Apple UI test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: apple-ui-results-${{ github.sha }}
          path: build/results/Talla-UI.xcresult
          if-no-files-found: warn
          retention-days: 14
      - name: Package unsigned QA artifacts
        run: |
          mkdir -p build/release-artifacts
          ditto -c -k --sequesterRsrc --keepParent "build/apple/Build/Products/Release-iphonesimulator/Talla Speciality.app" "build/release-artifacts/Talla-iOS-${GITHUB_SHA}.zip"
          ditto -c -k --sequesterRsrc --keepParent "build/watch/Build/Products/Release-watchsimulator/Talla Watch Watch App.app" "build/release-artifacts/Talla-watchOS-${GITHUB_SHA}.zip"
          shasum -a 256 build/release-artifacts/*.zip > build/release-artifacts/SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: apple-${{ github.sha }}
          path: build/release-artifacts/*.zip
          retention-days: 14
