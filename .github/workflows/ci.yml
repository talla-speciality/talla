name: Release pipeline

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: talla_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d talla_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/talla_ci
      PGSSLMODE: disable
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run migrations:validate
      - name: Apply migrations twice to prove idempotency
        run: npm run migrate && npm run migrate
      - run: npm test
      - name: Package backend release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tar --exclude=node_modules --exclude=data -czf ../talla-backend-${GITHUB_REF_NAME}.tar.gz .
          sha256sum ../talla-backend-${GITHUB_REF_NAME}.tar.gz > ../talla-backend-${GITHUB_REF_NAME}.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: backend-${{ github.ref_name }}
          path: |
            talla-backend-${{ github.ref_name }}.tar.gz
            talla-backend-${{ github.ref_name }}.tar.gz.sha256
          retention-days: 30

  android:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Test, lint, and build unsigned release APK
        run: ./gradlew -Ptalla.ci=true testDebugUnitTest lintDebug assembleRelease bundleRelease --stacktrace
      - name: Checksum Android artifacts
        run: sha256sum app/build/outputs/apk/release/*.apk app/build/outputs/bundle/release/*.aab > app/build/outputs/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/SHA256SUMS
            android/app/build/reports/lint-results-debug.html
            android/app/build/test-results/testDebugUnitTest/
          retention-days: 14

  apple:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select full Xcode 26.6
        run: sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
      - name: Build iPhone app and embedded extensions
        run: >-
          xcodebuild -project "Talla Speciality.xcodeproj" -scheme "Talla Speciality"
          -configuration Release -destination "generic/platform=iOS Simulator"
          -derivedDataPath build/apple CODE_SIGNING_ALLOWED=NO build
      - name: Select an available iPhone simulator
        run: echo "IOS_SIMULATOR_ID=$(xcrun simctl list devices available -j | jq -r '[.devices[] | .[] | select(.name | startswith("iPhone"))][0].udid')" >> "$GITHUB_ENV"
      - name: Run iPhone unit tests
        run: >-
          xcodebuild -project "Talla Speciality.xcodeproj" -scheme "Talla Speciality"
          -destination "platform=iOS Simulator,id=${IOS_SIMULATOR_ID}"
          -derivedDataPath build/apple-tests CODE_SIGNING_ALLOWED=NO
          -only-testing:"Talla SpecialityTests" test
      - name: Run release-hardening UI journeys
        run: >-
          xcodebuild -project "Talla Speciality.xcodeproj" -scheme "Talla Speciality"
          -destination "platform=iOS Simulator,id=${IOS_SIMULATOR_ID}"
          -derivedDataPath build/apple-ui-tests CODE_SIGNING_ALLOWED=NO
          -parallel-testing-enabled NO
          -maximum-concurrent-test-simulator-destinations 1
          -only-testing:"Talla SpecialityUITests/Talla_SpecialityUITests" test
      - name: Build Watch app
        run: >-
          xcodebuild -project "Talla Speciality.xcodeproj" -scheme "Talla Watch Watch App"
          -configuration Release -destination "generic/platform=watchOS Simulator"
          -derivedDataPath build/watch CODE_SIGNING_ALLOWED=NO build
      - name: Build iPhone widget
        run: >-
          xcodebuild -project "Talla Speciality.xcodeproj" -scheme "Talla WidgetsExtension"
          -configuration Release -destination "generic/platform=iOS Simulator"
          -derivedDataPath build/widget CODE_SIGNING_ALLOWED=NO build
      - name: Build Watch widget
        run: >-
          xcodebuild -project "Talla Speciality.xcodeproj" -scheme "Talla Watch WidgetsExtension"
          -configuration Release -destination "generic/platform=watchOS Simulator"
          -derivedDataPath build/watch-widget CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned QA artifacts
        run: |
          mkdir -p build/release-artifacts
          ditto -c -k --sequesterRsrc --keepParent "build/apple/Build/Products/Release-iphonesimulator/Talla Speciality.app" "build/release-artifacts/Talla-iOS-${GITHUB_SHA}.zip"
          ditto -c -k --sequesterRsrc --keepParent "build/watch/Build/Products/Release-watchsimulator/Talla Watch Watch App.app" "build/release-artifacts/Talla-watchOS-${GITHUB_SHA}.zip"
          shasum -a 256 build/release-artifacts/*.zip > build/release-artifacts/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: apple-${{ github.sha }}
          path: build/release-artifacts/*.zip
          retention-days: 14
