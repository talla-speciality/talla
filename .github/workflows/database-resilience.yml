name: Database resilience

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  encrypted-backup-and-restore:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: restore-test
          POSTGRES_DB: talla_restore
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d talla_restore"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
      RESTORE_DATABASE_URL: postgresql://postgres:restore-test@127.0.0.1:5432/talla_restore?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - name: Require protected backup secrets
        run: test -n "$PRODUCTION_DATABASE_URL" && test -n "$BACKUP_ENCRYPTION_KEY"
      - name: Install PostgreSQL 18 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          curl --fail --silent --show-error https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo "$VERSION_CODENAME")-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-18
      - name: Create production backup
        run: pg_dump "$PRODUCTION_DATABASE_URL" --format=custom --no-owner --no-privileges --file=talla-production.dump
      - name: Prove the backup restores
        run: |
          pg_restore --exit-on-error --no-owner --no-privileges --dbname="$RESTORE_DATABASE_URL" talla-production.dump
          psql "$RESTORE_DATABASE_URL" --set=ON_ERROR_STOP=1 --command="SELECT COUNT(*) AS applied_migrations FROM schema_migrations;"
          psql "$RESTORE_DATABASE_URL" --set=ON_ERROR_STOP=1 --command="SELECT COUNT(*) AS accounts FROM accounts;"
      - name: Encrypt backup
        run: openssl enc -aes-256-cbc -salt -pbkdf2 -iter 250000 -in talla-production.dump -out talla-production-${GITHUB_RUN_ID}.dump.enc -pass env:BACKUP_ENCRYPTION_KEY
      - name: Remove plaintext dump
        run: rm talla-production.dump
      - uses: actions/upload-artifact@v7
        with:
          name: postgres-backup-${{ github.run_id }}
          path: talla-production-${{ github.run_id }}.dump.enc
          retention-days: 14
          if-no-files-found: error
